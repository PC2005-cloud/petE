# ============================================================================
# dsh-pet-baifan 的 bundle patch —— 把「吃白饭」挂进 DSH 配置树
# ============================================================================
#
# 【约定】
#   - insert：往配置树里加一行插件 entry
#   - id 必须与包名一致，且全局唯一
#   - "id: 值" 那一行不能写行尾注释（商城预检用正则抓该行的值）
#
# 【命名】包名 / 插件 id / 客户端模块 id 全部带 `dsh-pet-` 前缀：它是 dsh-pet 的扩展，
#   前缀既表明归属，也避开 `baifan` 这种通用词被别的插件抢注。
#
# 【依赖】dsh-pet 必须已经在同一个 profile 里启用：本扩展不自己养宠物，
#   它靠 /dsh-pet-7340/* 的占用锁指挥桌宠，宠物不在就什么都不会发生。
#
# ============================================================================

- insert:
    - id: dsh-pet-baifan
      name: 'dsh-pet-baifan'
